<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Cover template: safe zones for kashanamjad.com</title>
  <rect width="1920" height="1080" fill="none" stroke="#e8a33d" stroke-width="6"/>
  <!-- wide window crop (2.2:1) -->
  <rect x="3" y="103" width="1914" height="874" fill="none" stroke="#5aa9e6" stroke-width="4" stroke-dasharray="18 12"/>
  <text x="24" y="140" font-family="Arial, sans-serif" font-size="30" fill="#5aa9e6">WIDE WINDOW (2.2:1)</text>
  <!-- square window crop (1:1) -->
  <rect x="420" y="3" width="1080" height="1074" fill="none" stroke="#9be07a" stroke-width="4" stroke-dasharray="18 12"/>
  <text x="440" y="44" font-family="Arial, sans-serif" font-size="30" fill="#9be07a">SQUARE WINDOW (1:1)</text>
  <!-- phone carousel crop (4:5) -->
  <rect x="528" y="3" width="864" height="1074" fill="none" stroke="#f07a7a" stroke-width="4" stroke-dasharray="18 12"/>
  <text x="548" y="1060" font-family="Arial, sans-serif" font-size="30" fill="#f07a7a">PHONE CAROUSEL (4:5)</text>
  <!-- safe zone -->
  <rect x="528" y="103" width="864" height="874" fill="#e8a33d" fill-opacity=".12" stroke="#e8a33d" stroke-width="5"/>
  <text x="960" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#e8a33d">SAFE ZONE</text>
  <text x="960" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#e8a33d">Keep faces, product and any title in here</text>
  <text x="1896" y="1060" text-anchor="end" font-family="Arial, sans-serif" font-size="26" fill="#e8a33d">FULL COVER 1920×1080 = DESKTOP CAROUSEL</text>
</svg>
